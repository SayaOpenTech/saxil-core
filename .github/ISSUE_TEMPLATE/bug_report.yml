name: Bug report
description: Report a reproducible problem in the public SDK, examples or docs.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        This is a public issue. For suspected vulnerabilities, use the private channel in [SECURITY.md](https://github.com/SayaOpenTech/saxil-core/blob/main/SECURITY.md). Use synthetic inputs and remove credentials/personal data from examples and logs.
  - type: input
    id: version
    attributes:
      label: SDK version and installation source
      placeholder: 'saxil-core 0.1.0 from PyPI, or public source commit'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: 'Python 3.13, Windows or Linux'
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands and a small synthetic input. Public files only.
      render: text
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Include the error class/code or a short sanitized output if relevant.
    validations:
      required: true
