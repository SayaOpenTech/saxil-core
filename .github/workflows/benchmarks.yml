name: Public benchmark smoke

on:
  pull_request:
    branches: [main]
    paths: ['benchmarks/**', '.github/workflows/benchmarks.yml']
  push:
    branches: [main]
    paths: ['benchmarks/**', '.github/workflows/benchmarks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark equivalence and CPU smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install released wheel
        run: >-
          python -m pip install --only-binary=:all: saxil-core==0.1.0
      - name: Run equivalence controls and CPU benchmark
        run: python -I benchmarks/run_benchmark.py --iterations 200 --trials 3 --output benchmark-results.json
      - name: Preserve raw benchmark evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-benchmark-${{ github.run_id }}
          path: benchmark-results.json
          retention-days: 30
          if-no-files-found: error
