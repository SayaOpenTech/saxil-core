name: Security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bandit:
    name: Bandit (public Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Install static analysis tool
        run: python -m pip install -r requirements-security.txt

      # Parse public production Python without installing or executing the SDK.
      # Fail on medium/high severity AND medium/high confidence; no rule skips.
      - name: Scan public SDK
        run: >-
          python -m bandit -r src
          --severity-level medium --confidence-level medium
