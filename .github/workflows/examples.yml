name: Released SDK examples

on:
  pull_request:
    branches: [main]
    paths: ['examples/**', 'integrations/**', '.github/workflows/examples.yml']
  push:
    branches: [main]
    paths: ['examples/**', 'integrations/**', '.github/workflows/examples.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    name: Released examples (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install published SDK, never the checkout
        run: >-
          python -m pip install --only-binary=:all: saxil-core==0.1.0
      - name: Run all three examples
        run: python -I examples/run_examples.py
      - name: Run quote-service integration and boundary checks
        run: python -I integrations/price_service/run_demo.py
