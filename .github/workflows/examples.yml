name: Released SDK examples

on:
  pull_request:
    branches: [main]
    paths: ['examples/**', '.github/workflows/examples.yml']
  push:
    branches: [main]
    paths: ['examples/**', '.github/workflows/examples.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    name: Released examples (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install published SDK, never the checkout
        run: >-
          python -m pip install --only-binary=:all: saxil-core==0.1.0
      - name: Run all three examples
        run: python -I examples/run_examples.py
