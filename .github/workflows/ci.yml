name: Public CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Public SDK (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out public source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      # Each matrix job has a fresh hosted runner and independent dependencies.
      - name: Install public SDK and test dependencies
        run: python -m pip install ".[dev]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Smoke test installed public SDK
        shell: python -I {0}
        run: |
          from importlib.metadata import version
          from pathlib import Path
          import sysconfig

          import saxil_core
          from saxil_core import SemanticFrame, decode, encode, get_version_info

          installed = Path(sysconfig.get_path("purelib")).resolve()
          assert Path(saxil_core.__file__).resolve().is_relative_to(installed)
          assert version("saxil-core") == saxil_core.SOFTWARE_VERSION
          for name in saxil_core.__all__:
              getattr(saxil_core, name)
          frame = SemanticFrame(
              speaker="user", act="ask", intent="query_price", polarity="pos"
          )
          payload = encode(frame)
          assert encode(decode(payload)) == payload
          print(get_version_info())

      - name: Run public test suite
        run: python -m pytest tests -q
